<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portafolio de Santiago</title>
</head>
<body>
  <h1>Portafolio de Santiago</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Nombre del Proyecto</th>
        <th>Descripción</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="cuerpo-proyectos"></tbody>
  </table>

  <hr>
  <h2>Registrar Nuevo Proyecto</h2>
  <form id="form-proyecto">
    <label>Cliente:
      <select id="campo-cliente"></select>
    </label>
    <label>Nombre del Proyecto:
      <input type="text" id="campo-nombre" required>
    </label>
    <label>Descripción:
      <input type="text" id="campo-descripcion">
    </label>
    <button type="submit">Registrar Proyecto</button>
  </form>
  <p id="mensaje-proyecto"></p>

  <!-- scripts cargados en el orden correcto -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
